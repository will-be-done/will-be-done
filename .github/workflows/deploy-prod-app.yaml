name: Deploy prod app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-wbd-app-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy wbd-app-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Compute Sentry release
        id: sentry
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "release=${version}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Deploy production app
        run: |
          flyctl deploy --remote-only --config fly.app.prod.toml --app wbd-app-prod \
            --build-arg VITE_SENTRY_DSN="${{ secrets.WBD_WEB_SENTRY_DSN }}" \
            --build-arg VITE_SENTRY_RELEASE="${{ steps.sentry.outputs.release }}" \
            --build-arg VITE_POSTHOG_KEY="${{ secrets.WBD_POSTHOG_KEY }}" \
            --build-arg VITE_POSTHOG_HOST="https://eu.i.posthog.com" \
            --build-arg VITE_POSTHOG_UI_HOST="https://eu.posthog.com" \
            --env WBD_SENTRY_RELEASE="${{ steps.sentry.outputs.release }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_APP_PROD }}
