name: Sync release pages

# Turns a published GitHub release into a page on the landing site. The generated
# headline and summary are a starting point, so this opens a pull request for
# review rather than pushing to main.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-release-pages
  cancel-in-progress: false

env:
  BRANCH: release-pages/pending

jobs:
  sync:
    name: Generate landing pages for new releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two releases published before the first pull request is merged would
      # otherwise each generate a branch off main, and the second would repeat
      # everything in the first. Continuing on the pending branch keeps one
      # reviewable pull request that collects whatever is not merged yet.
      - name: Continue the pending release-pages branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
            echo "Continuing $BRANCH."
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            echo "Starting $BRANCH from main."
            git checkout -B "$BRANCH"
          fi

      # No --tag here on purpose: the script already generates only the releases
      # that have no page yet, and --tag would overwrite a page whose copy has
      # been rewritten by hand if a release is ever edited and re-published.
      - name: Sync releases
        run: pnpm -C apps/landing sync:releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format generated markdown
        run: pnpm prettier --write "apps/landing/src/content/releases/**/*.md"

      - name: Build landing
        run: pnpm -C apps/landing build

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain apps/landing/src/content/releases apps/landing/src/assets/releases)" ]; then
            echo "No new releases to publish."
            exit 0
          fi

          git add apps/landing/src/content/releases apps/landing/src/assets/releases
          git commit -m "docs: add landing pages for new releases"
          git push origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Pushed to the pull request that is already open for $BRANCH."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Add landing pages for new releases" \
            --body "Generated by \`apps/landing/scripts/sync-releases.ts\`.

          The \`headline\`, \`summary\` and \`highlights\` in the frontmatter are derived from the
          release body automatically. Review and rewrite them before merging: they become the
          \`<h1>\`, the meta description and the at-a-glance list on the page."
