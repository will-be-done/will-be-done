name: Release CLI

# Builds the wbd binaries for every platform from one runner (Bun cross-compiles),
# signs and notarizes the macOS ones with the desktop app's Developer ID, and
# publishes them on a `cli-v*` release. The release is never marked latest: that
# slot belongs to the desktop app, which the landing download page reads.

on:
  push:
    tags:
      - "cli-v[0-9]+.[0-9]+.[0-9]+"
  # Dry run: builds, signs and notarizes without publishing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Validate version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          PACKAGE_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "apps/cli/package.json version ($PACKAGE_VERSION) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm -C apps/cli ts && pnpm -C apps/cli test

      - name: Build binaries
        working-directory: apps/cli
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            bun build src/main.ts --compile --minify --target="bun-$target" --outfile "dist/wbd-$target"
          done
          ./dist/wbd-linux-x64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: wbd-unsigned
          path: apps/cli/dist/*
          if-no-files-found: error
          retention-days: 1

  sign-macos:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: apps/cli/entitlements.mac.plist
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: wbd-unsigned
          path: dist

      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          # Same secret electron-builder uses: a base64 .p12 or a URL to one.
          case "$CSC_LINK" in
            http*) curl -fsSL "$CSC_LINK" -o "$RUNNER_TEMP/cert.p12" ;;
            *) printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12" ;;
          esac

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -n 1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in CSC_LINK"
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign
        run: |
          set -euo pipefail
          for binary in dist/wbd-darwin-x64 dist/wbd-darwin-arm64; do
            codesign --force --timestamp --options runtime \
              --entitlements apps/cli/entitlements.mac.plist \
              --keychain "$KEYCHAIN" --sign "$IDENTITY" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done
          chmod +x dist/wbd-darwin-arm64
          ./dist/wbd-darwin-arm64 --version

      # A bare executable can't have its ticket stapled; Gatekeeper looks it up online.
      - name: Notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k dist/wbd-darwin-x64 "$RUNNER_TEMP/wbd-darwin-x64.zip"
          ditto -c -k dist/wbd-darwin-arm64 "$RUNNER_TEMP/wbd-darwin-arm64.zip"
          for archive in "$RUNNER_TEMP"/wbd-darwin-*.zip; do
            RESULT=$(xcrun notarytool submit "$archive" --wait --output-format json \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
            echo "$RESULT"
            if [ "$(echo "$RESULT" | jq -r .status)" != "Accepted" ]; then
              xcrun notarytool log "$(echo "$RESULT" | jq -r .id)" \
                --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
              exit 1
            fi
          done
          rm "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: wbd-macos-signed
          path: |
            dist/wbd-darwin-x64
            dist/wbd-darwin-arm64
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, sign-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wbd-unsigned
          path: dist

      # Replaces the ad-hoc signed macOS binaries from the build job.
      - uses: actions/download-artifact@v4
        with:
          name: wbd-macos-signed
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum wbd-* > checksums.txt
          cat checksums.txt
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CLI $VERSION" \
            --latest=false \
            --notes "Install or update the Will Be Done CLI:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/apps/cli/install.sh | sh
          \`\`\`

          Windows: download \`wbd-windows-x64.exe\` below."
