name: CI

env:
  RUST_VERSION: "1.90.0"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  lint-and-typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        package: [web, api, slices]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint @apps/${{ matrix.package }}
        run: pnpm -C apps/${{ matrix.package }} lint

      - name: TypeCheck @apps/${{ matrix.package }}
        run: pnpm -C apps/${{ matrix.package }} ts

      - name: Test @apps/${{ matrix.package }}
        if: matrix.package == 'api' || matrix.package == 'slices'
        run: pnpm -C apps/${{ matrix.package }} test

      - name: Check OpenAPI snapshot
        if: matrix.package == 'api'
        run: pnpm -C apps/api openapi:check

      - name: Generate OpenAPI client
        if: matrix.package == 'api'
        run: pnpm -C apps/api client:generate

      - name: Check generated OpenAPI client
        if: matrix.package == 'api'
        run: |
          changes="$(git status --porcelain --untracked-files=all -- apps/api/src/generated)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff -- apps/api/src/generated
            exit 1
          fi

  tursod:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Build tursod
        run: cargo build --locked --manifest-path apps/tursod/Cargo.toml

      - name: Lint tursod
        run: cargo clippy --locked --manifest-path apps/tursod/Cargo.toml --all-targets -- -D warnings

      - name: Test tursod
        run: cargo test --locked --manifest-path apps/tursod/Cargo.toml

  openapi-compatibility:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Check for an existing OpenAPI baseline
        id: baseline
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:apps/api/openapi.json"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for breaking OpenAPI changes
        if: steps.baseline.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@35b32248b144707e94e72a8d0a1456da9d6618c2
        with:
          base: origin/${{ github.base_ref }}:apps/api/openapi.json
          revision: HEAD:apps/api/openapi.json
          fail-on: WARN
          review: false

  web-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Run web e2e tests
        run: pnpm -C apps/web test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  api-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.8.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API e2e tests
        run: pnpm -C apps/api test:e2e
