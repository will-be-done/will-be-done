name: Canary Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: will-be-done/will-be-done

jobs:
  build-canary:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          commit="$(git rev-parse --short=8 HEAD)"
          echo "tag=$commit" >> "$GITHUB_OUTPUT"
          echo "release=${version}-${commit}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=canary
            type=raw,value=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=will-be-done
            org.opencontainers.image.description=Task management application
            org.opencontainers.image.vendor=will-be-done

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.WBD_WEB_SENTRY_DSN }}
            VITE_SENTRY_RELEASE=${{ steps.tag.outputs.release }}
