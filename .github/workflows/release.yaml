name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: will-be-done/will-be-done

jobs:
  validate-tag:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: extract
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate semver format
        run: |
          VERSION=${{ steps.extract.outputs.version }}
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must follow semantic versioning (v0.1.0)"
            exit 1
          fi

      - name: Validate desktop package version
        run: |
          TAG_VERSION=${{ steps.extract.outputs.version }}
          PACKAGE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Error: apps/desktop/package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

  build-release:
    needs: validate-tag
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Sentry release
        id: sentry
        run: echo "release=${{ needs.validate-tag.outputs.version }}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=will-be-done
            org.opencontainers.image.description=Task management application
            org.opencontainers.image.vendor=will-be-done
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate-tag.outputs.version }}
            VITE_SENTRY_DSN=${{ secrets.WBD_WEB_SENTRY_DSN }}
            VITE_SENTRY_RELEASE=${{ steps.sentry.outputs.release }}

      - name: Create release summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Release ${{ needs.validate-tag.outputs.version }} Published

          ### Docker Images
          - \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-tag.outputs.version }}\`
          - \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`

          ### Platforms
          - linux/amd64
          - linux/arm64

          ### Pull Command
          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-tag.outputs.version }}
          \`\`\`
          EOF

  build-desktop:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: blacksmith-4vcpu-windows-2025
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install snapcraft (Linux only)
        if: matrix.platform == 'linux'
        run: sudo snap install snapcraft --classic

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rpm
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build electron-vite app
        working-directory: apps/desktop
        run: pnpm exec electron-vite build

      - name: Prepare Apple notarization key (macOS only)
        if: matrix.platform == 'mac'
        run: |
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build desktop app (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-builder --publish never

      - name: Build desktop app (Windows)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --publish never

      - name: Build desktop app (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        env:
          DEBUG: "@malept/flatpak-bundler"
        run: pnpm exec electron-builder --linux --publish never

      - name: Upload desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*
            !apps/desktop/dist/builder-*.yml
            !apps/desktop/dist/mac*/**
            !apps/desktop/dist/linux*/**
            !apps/desktop/dist/win*/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-desktop:
    needs:
      - validate-tag
      - build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop assets
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
