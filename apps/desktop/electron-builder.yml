appId: app.willbedone.WillBeDone
productName: Will Be Done
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: will-be-done
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: universal
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  forceCodeSigning: true
  extendInfo:
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - flatpak
    - snap
    - deb
    - rpm
  maintainer: will-be-done.app
  category: Office
  syncDesktopName: true
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: '24.08'
  sdk: org.freedesktop.Sdk
  baseVersion: '24.08'
  useWaylandFlags: true
  files:
    - - resources/flatpak/will-be-done-quick-add
      - /bin/will-be-done-quick-add
    - - resources/flatpak/will-be-done-show
      - /bin/will-be-done-show
  desktop:
    entry:
      Actions: QuickAdd;
    desktopActions:
      QuickAdd:
        Name: Quick Add
        Exec: will-be-done-quick-add
  # Specifying finishArgs replaces electron-builder's defaults, so keep them
  # here and add the StatusNotifier permission required by Electron's Linux tray.
  finishArgs:
    - '--socket=wayland'
    - '--socket=fallback-x11'
    - '--share=ipc'
    - '--device=dri'
    - '--socket=pulseaudio'
    - '--share=network'
    - '--talk-name=org.freedesktop.Notifications'
    - '--talk-name=org.kde.StatusNotifierWatcher'
  artifactName: ${name}-${version}.${ext}
snap:
  publish:
    - github
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: will-be-done
  repo: will-be-done
  releaseType: draft
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
