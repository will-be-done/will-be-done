[package]
name = "tursod"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = "1.0.229"
serde_derive = "1.0.229"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
turso = "0.8.0-pre.3"
thiserror = "2"
uuid = "1.24.0"

[dev-dependencies]
http-body-util = "0.1.3"
pretty_assertions = "1"
serde_json = "1.0.149"
tempfile = "3.23.0"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
